      - "2. สถาปัตยกรรมภายใน": 01-basics/02-architecture.md
      - "3. แนวคิด Dual-Stream": 01-basics/03-dual-stream.md

  - "ภาค 2 — เตรียมความพร้อม":
      - "4. เลือกฮาร์ดแวร์": 02-prepare/04-hardware.md
      - "5. เลือกและตั้งค่ากล้อง": 02-prepare/05-cameras.md
      - "6. วางแผนพื้นที่จัดเก็บ": 02-prepare/06-storage.md

  - "ภาค 3 — ติดตั้ง":
      - "7. Docker Compose": 03-install/07-docker.md
      - "8. Home Assistant / Proxmox": 03-install/08-ha-proxmox.md
      - "9. go2rtc": 03-install/09-go2rtc.md

  - "ภาค 4 — Config":
      - "10. โครงสร้าง config.yml": 04-config/10-structure.md
      - "11. Config เริ่มต้น": 04-config/11-starter-config.md
      - "12. Detectors": 04-config/12-detectors.md
      - "13. Zones, Masks, Filters": 04-config/13-zones-masks.md
      - "14. Recording & Retention": 04-config/14-recording.md
      - "15. Snapshots & Notifications": 04-config/15-snapshots.md

  - "ภาค 5 — จูนให้เทพ":
      - "16. ลด False Positive": 05-tuning/16-false-positive.md
      - "17. จูนประสิทธิภาพ": 05-tuning/17-performance.md
